<rect x="64" y="664" width="1472" height="272" rx="13" fill="white" stroke="#c7d9df"/>
<text x="87" y="705" fill="#193746" font-size="25" font-weight="700" >04  Four words</text>
<text x="87" y="748" fill="#286e87" font-size="14" font-weight="700" letter-spacing="2">MOULD</text>
<text x="210" y="748" fill="#34505e" font-size="17" font-weight="400" >The conditions we shape: the basin walls, the disc and the dome shells. Nothing moves mechanically.</text>
<text x="87" y="784" fill="#286e87" font-size="14" font-weight="700" letter-spacing="2">MOLD</text>
<text x="210" y="784" fill="#34505e" font-size="17" font-weight="400" >What happens by itself: wake, weather, daylight, and twenty weeks of fouling on anything that floats.</text>
<text x="87" y="820" fill="#286e87" font-size="14" font-weight="700" letter-spacing="2">BUBBLES</text>
<text x="210" y="820" fill="#34505e" font-size="17" font-weight="400" >Each dome with its reflected half, and the glow that rises through them after dark.</text>
<text x="87" y="856" fill="#286e87" font-size="14" font-weight="700" letter-spacing="2">GOO</text>
<text x="210" y="856" fill="#34505e" font-size="17" font-weight="400" >The mother, the disc that grows on top of a jar of fermenting tea and is passed from kitchen to kitchen. Under it, the lake.</text>
<text x="87" y="912" fill="#4f6877" font-size="15" font-weight="400" font-style="italic">A bubble in kitchen foam is a few millimetres across. The largest dome is about a thousand times that.</text>
<text x="67" y="970" fill="#587986" font-size="14" font-weight="400" >Illustrative optical-study geometry. Not a site survey, mooring plan, navigation plan or engineered design. Reflections are virtual; nothing below the waterline is built.</text>
</svg>
