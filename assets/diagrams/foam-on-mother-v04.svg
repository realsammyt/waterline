<text x="67" y="63" fill="#246980" font-size="16" font-weight="700" letter-spacing="3">WATERLINE  /  OPTICAL STUDY 04</text>
<text x="64" y="126" fill="#182d3a" font-size="55" font-weight="700" >Foam on mother</text>
<text x="67" y="163" fill="#4f6877" font-size="22" font-weight="400" >One low disc. Nine fixed domes. The lake finishes the rim domes into bubbles; a wake takes them apart.</text>
